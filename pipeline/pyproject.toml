[project]
name = "rio-audio-guide-sourcing"
version = "0.1.0"
description = "Location sourcing pipeline for Rio Audio Guide"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.0",
    "requests>=2.32.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
