apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-worker }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-worker }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: database-url } }
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: rabbitmq-url } }
            - name: S3_BUCKET
              value: "{{ .Values.s3.bucket }}"
            - name: ELEVENLABS_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: elevenlabs-api-key } }
