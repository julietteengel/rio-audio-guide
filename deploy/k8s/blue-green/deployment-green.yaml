apiVersion: apps/v1
kind: Deployment
metadata:
  name: rio-api-green
spec:
  replicas: 3
  selector:
    matchLabels: { app: rio-api, slot: green }
  template:
    metadata:
      labels: { app: rio-api, slot: green }
    spec:
      containers:
        - name: api
          image: rio-api:v1.1.0
          ports: [{ containerPort: 8080 }]
